<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5a0c15">
  <title>Sem conexão | Pai D'Égua</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fffaf1;color:#1e1714}.card{width:min(520px,100%);padding:34px;border:1px solid rgba(67,30,24,.13);border-radius:28px;background:#fff;box-shadow:0 22px 60px rgba(48,11,13,.15);text-align:center}.mark{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 20px;border-radius:24px 24px 24px 8px;background:#6f121d;color:#fff3dc;font:700 38px Georgia,serif}h1{margin:0;color:#3b080d;font:700 42px/1 Georgia,serif}p{margin:16px 0 24px;color:#6d5b53;line-height:1.65}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border:0;border-radius:999px;background:#6f121d;color:white;font-weight:800;text-decoration:none;cursor:pointer}.secondary{margin-top:10px;background:#fff3dc;color:#510c14}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">P</div>
    <h1>Você está sem conexão</h1>
    <p>O cardápio salvo continua disponível quando já foi aberto neste aparelho. Reconecte-se para acessar o pedido oficial e o Google Maps.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button><br>
    <a class="secondary" href="/">Voltar ao início</a>
  </main>
</body>
</html>
